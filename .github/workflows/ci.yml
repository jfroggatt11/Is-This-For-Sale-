name: Python package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m build
      - name: Installed-wheel resource smoke test
        run: |
          python -m venv /tmp/itsfs-wheel
          /tmp/itsfs-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/itsfs-wheel/bin/itsfs sources --json
          /tmp/itsfs-wheel/bin/python -c "from itsfs.geocoding import LocalGeocoder; from itsfs.geo import detect_country; p=LocalGeocoder().geocode('Anacapri, Italy'); assert detect_country(p.latitude,p.longitude)=='IT'"
